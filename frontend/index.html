<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="NoSquito Florida Mosquito Treatment Dashboard"
  />

  <title>NoSquito — Florida Mosquito Treatment Dashboard</title>
</head>

<body>

  <div id="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="topbar">

      <div class="brand">

        <button
          class="brand-pill"
          id="homeBtn"
          type="button"
          aria-label="Return home"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 11.5L12 4l9 7.5" />
            <path d="M5 10.5V20h14v-9.5" />
          </svg>

          NOSQUITO
        </button>

      </div>


      <h1 class="title">
        FLORIDA MOSQUITO TREATMENT DASHBOARD
      </h1>


      <div class="status-chip">

        <span class="status-dot"></span>

        <span>
          LIVE DATA
        </span>

      </div>

    </header>


    <!-- =====================================================
         MAIN LAYOUT
    ====================================================== -->

    <div class="layout">


      <!-- ===================================================
           LEFT SIDEBAR
      ==================================================== -->

      <aside class="sidebar">

        <div class="action-row">

          <button
            class="circle-btn"
            id="forecastBtn"
            type="button"
          >
            TREATMENT
            <br />
            PREDICTION
          </button>


          <button
            class="circle-btn icon-only"
            id="searchToggleBtn"
            type="button"
            aria-label="Search counties"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-4-4"></path>
            </svg>

          </button>

        </div>


        <div>

          <p class="sidebar-label">
            TOGGLE MAP LAYER
          </p>


          <div
            class="layer-list"
            id="layerList"
          >


            <!-- TREATMENT PRIORITY -->

            <button
              class="layer-btn"
              type="button"
              data-layer="priority"
              aria-pressed="true"
            >

              <div class="layer-thumb">

                <svg viewBox="0 0 80 100">

                  <path
                    d="
                      M31 5
                      L49 8
                      L60 21
                      L58 34
                      L64 47
                      L57 59
                      L60 72
                      L50 84
                      L42 96
                      L32 83
                      L25 72
                      L28 58
                      L20 47
                      L25 34
                      L21 21
                      Z
                    "
                    fill="#93e35c"
                  />

                </svg>

              </div>

              <span class="layer-name">
                TREATMENT
                <br />
                PRIORITY
              </span>

            </button>


            <!-- MOSQUITO CONTROL -->

            <button
              class="layer-btn"
              type="button"
              data-layer="mosquito"
              aria-pressed="false"
            >

              <div class="layer-thumb">

                <svg viewBox="0 0 80 100">

                  <defs>

                    <linearGradient
                      id="mosquitoGradient"
                      x1="0"
                      y1="0"
                      x2="1"
                      y2="1"
                    >

                      <stop
                        offset="0%"
                        stop-color="#f0c94a"
                      />

                      <stop
                        offset="50%"
                        stop-color="#f2874e"
                      />

                      <stop
                        offset="100%"
                        stop-color="#e5484d"
                      />

                    </linearGradient>

                  </defs>


                  <path
                    d="
                      M31 5
                      L49 8
                      L60 21
                      L58 34
                      L64 47
                      L57 59
                      L60 72
                      L50 84
                      L42 96
                      L32 83
                      L25 72
                      L28 58
                      L20 47
                      L25 34
                      L21 21
                      Z
                    "
                    fill="url(#mosquitoGradient)"
                  />

                </svg>

              </div>

              <span class="layer-name">
                MOSQUITO
                <br />
                CONTROL
              </span>

            </button>


            <!-- NASA WEATHER -->

            <button
              class="layer-btn"
              type="button"
              data-layer="weather"
              aria-pressed="false"
            >

              <div class="layer-thumb">

                <svg viewBox="0 0 80 100">

                  <defs>

                    <linearGradient
                      id="weatherGradient"
                      x1="0"
                      y1="0"
                      x2="1"
                      y2="1"
                    >

                      <stop
                        offset="0%"
                        stop-color="#7fd7ff"
                      />

                      <stop
                        offset="50%"
                        stop-color="#4d9ee8"
                      />

                      <stop
                        offset="100%"
                        stop-color="#245ca6"
                      />

                    </linearGradient>

                  </defs>


                  <path
                    d="
                      M31 5
                      L49 8
                      L60 21
                      L58 34
                      L64 47
                      L57 59
                      L60 72
                      L50 84
                      L42 96
                      L32 83
                      L25 72
                      L28 58
                      L20 47
                      L25 34
                      L21 21
                      Z
                    "
                    fill="url(#weatherGradient)"
                  />

                </svg>

              </div>

              <span class="layer-name">
                NASA
                <br />
                WEATHER
              </span>

            </button>

          </div>

        </div>

      </aside>


      <!-- ===================================================
           MAP AREA
      ==================================================== -->

      <main
        class="map-area"
        id="mapArea"
      >


        <!-- =================================================
             REAL FLORIDA COUNTY MAP

             IMPORTANT:
             main.js inserts all 67 county <path> elements
             inside #countyMap.
        ================================================== -->

        <div class="map-svg-wrap">

          <svg
            id="floridaSvg"
            viewBox="0 0 800 700"
            preserveAspectRatio="xMidYMid meet"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Interactive map of Florida counties"
          >

            <g id="countyMap"></g>

          </svg>

        </div>


        <!-- =================================================
             TOP MAP OVERLAYS
        ================================================== -->

        <div class="map-overlays">


          <!-- SEARCH -->

          <div
            class="search-wrap"
            id="searchWrap"
            style="display: none;"
          >

            <input
              class="search-input"
              id="searchInput"
              type="text"
              placeholder="Search Florida county..."
              autocomplete="off"
              aria-label="Search Florida counties"
            />

            <div
              class="search-results"
              id="searchResults"
            ></div>

          </div>


          <!-- FLORIDA SUMMARY -->

          <div class="summary-card">

            <p class="summary-title">
              FLORIDA TREATMENT OVERVIEW
            </p>

            <div
              class="summary-grid"
              id="summaryGrid"
            ></div>

          </div>

        </div>


        <!-- =================================================
             LEGEND
        ================================================== -->

        <div
          class="legend-card"
          id="legendCard"
        ></div>


        <!-- =================================================
             TOAST
        ================================================== -->

        <div
          class="toast"
          id="toast"
          role="status"
          aria-live="polite"
        ></div>

      </main>


      <!-- ===================================================
           RIGHT PANEL
      ==================================================== -->

      <div
        class="panel-shell"
        id="panelShell"
      >


        <!-- COLLAPSE BUTTON -->

        <button
          class="collapse-toggle"
          id="collapseToggle"
          type="button"
          aria-label="Collapse information panel"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="M15 18l-6-6 6-6"></path>
          </svg>

        </button>


        <section class="right-panel">


          <!-- ===============================================
               PANEL TABS
          ================================================ -->

          <div class="panel-tabs">


            <!-- SKEETER TAB -->

            <button
              class="tab-btn active"
              type="button"
              data-tab="skeeter"
            >

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="
                    M21 15
                    a4 4 0 0 1 -4 4
                    H8
                    l-5 3
                    1.5-5
                    A7 7 0 1 1 21 15
                    Z
                  "
                ></path>
              </svg>

              Ask Skeeter

            </button>


            <!-- DETAILS TAB -->

            <button
              class="tab-btn"
              type="button"
              data-tab="details"
            >

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle
                  cx="12"
                  cy="12"
                  r="9"
                ></circle>

                <path d="M12 11v5"></path>
                <path d="M12 8h.01"></path>
              </svg>

              Details

              <span class="dot-flag"></span>

            </button>

          </div>


          <!-- ===============================================
               SKEETER TAB BODY
          ================================================ -->

          <div
            class="panel-body skeeter-tab active"
            data-panel="skeeter"
          >


            <!-- COUNTY CONTEXT -->

            <div
              class="skeeter-context-bar"
              id="skeeterContextBar"
            >
              Florida statewide data
            </div>


            <!-- CHAT -->

            <div
              class="chat-log"
              id="chatLog"
            ></div>


            <!-- SUGGESTED QUESTIONS -->

            <div
              class="suggested-prompts"
              id="suggestedPrompts"
            ></div>


            <!-- CHAT INPUT -->

            <div class="chat-input-row">


              <button
                class="clear-btn"
                id="clearChatBtn"
                type="button"
                aria-label="Clear chat"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M4 7h16"></path>
                  <path d="M9 7V4h6v3"></path>
                  <path d="M7 7l1 13h8l1-13"></path>
                </svg>

              </button>


              <input
                class="chat-input"
                id="chatInput"
                type="text"
                placeholder="Ask the data..."
                autocomplete="off"
                aria-label="Ask Skeeter a question"
              />


              <button
                class="send-btn"
                id="sendBtn"
                type="button"
                aria-label="Send message"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <path d="M5 12h13"></path>
                  <path d="M13 6l6 6-6 6"></path>
                </svg>

              </button>

            </div>

          </div>


          <!-- ===============================================
               DETAILS TAB BODY
          ================================================ -->

          <div
            class="panel-body"
            data-panel="details"
          >


            <!-- EMPTY STATE -->

            <div
              class="detail-empty"
              id="detailEmpty"
            >

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <path d="M12 21s7-5.2 7-12A7 7 0 0 0 5 9c0 6.8 7 12 7 12Z"></path>

                <circle
                  cx="12"
                  cy="9"
                  r="2.3"
                ></circle>
              </svg>


              <p>
                Select a county on the map to view treatment
                priority, mosquito activity, weather conditions,
                and forecast information.
              </p>

            </div>


            <!-- COUNTY DETAILS GET INSERTED HERE -->

            <div
              id="detailContent"
              style="display: none;"
            ></div>

          </div>

        </section>

      </div>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script
    type="module"
    src="/src/main.js"
  ></script>

</body>
</html>
